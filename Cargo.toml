[package]
name = "eldenring-alt-saves"
version = "1.4.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

[dependencies]
toml = "0.7.2"
region = "3.0.2"
pelite = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-panic = "0.1"
tracing-appender = "0.2.3"

[dependencies.windows]
features = [
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
]
version = "0.58.0"

[dependencies.retour]
version = "0.3"
features = ["static-detour"]

[dependencies.serde]
version = "1"
features = ["derive"]

[patch.crates-io]
libudis86-sys = { git = 'https://github.com/vars1ty/libudis86-sys.git' }
